name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (CPU-only PyTorch, versions from uv.lock)
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check src scripts tests app

      - name: Tests (synthetic ECG, no downloads)
        run: uv run pytest -q
